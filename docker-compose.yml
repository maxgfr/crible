# FR-008 — docker compose up with ZERO keys yields a fully working system.
# The stack is keyless by construction: no provider key is read anywhere.
#
# ONE image for both services: only `api` carries the build section, `ingest`
# reuses the very same tag, so `docker compose build` builds once (two build
# sections on one tag built the image twice). CRIBLE_IMAGE overrides the tag
# (e.g. a pinned release, or a throwaway tag for local testing).

services:
  ingest:
    image: ${CRIBLE_IMAGE:-ghcr.io/maxgfr/crible:latest}
    # never pull on its own: the tag comes from api's build (or from an
    # explicit `docker compose pull`), so both services always run one image
    pull_policy: never
    command: ["crible", "ingest", "--loop"]
    volumes:
      - crible-data:/data
    environment:
      CRIBLE_DATA_DIR: /data
      CRIBLE_BUDGET_PER_HOUR: ${CRIBLE_BUDGET_PER_HOUR:-330}
      CRIBLE_BOOTSTRAP_SAMPLE: ${CRIBLE_BOOTSTRAP_SAMPLE:-}
      # SEC fair-access: naming the operator (+ contact email) is polite and
      # avoids WAF throttling of the EDGAR audited-US layer. Keyless, optional.
      CRIBLE_SEC_USER_AGENT: ${CRIBLE_SEC_USER_AGENT:-crible-screener}
      # optional: whole-US audited coverage via the companyfacts bulk (~1.4 GB
      # weekly) instead of the per-CIK trickle — set to 1 to enable
      CRIBLE_EDGAR_BULK: ${CRIBLE_EDGAR_BULK:-}
    # healthy = the loop wrote its heartbeat (status.json, rewritten after
    # every crawl cycle) less than 2 h ago; a missing or stale heartbeat
    # means the loop is dead or wedged. start_period covers the first cycle
    # on an empty volume (universe download + bootstrap sample).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib,sys,time; p=pathlib.Path(os.environ.get('CRIBLE_DATA_DIR','/data'))/'status.json'; sys.exit(0 if p.is_file() and time.time()-p.stat().st_mtime < 7200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15m
    restart: unless-stopped

  api:
    image: ${CRIBLE_IMAGE:-ghcr.io/maxgfr/crible:latest}
    build: .
    ports:
      - "${CRIBLE_PORT:-8000}:8000"
    volumes:
      - crible-data:/data
    environment:
      CRIBLE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - ingest
    restart: unless-stopped

volumes:
  crible-data:

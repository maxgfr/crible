# Keeps the patch-pinned Docker bases (Dockerfile), the pinned GitHub
# Actions and both lockfiles (uv.lock, ui/package-lock.json) fresh. Monthly:
# low churn, the pins exist for reproducibility,
# not for chasing every patch the day it ships.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The python base is the project's interpreter: it must match
      # requires-python (pyproject.toml, 3.12 only), or `uv sync` finds no
      # interpreter and the image build fails. Only 3.12.x patches come from
      # here; a new interpreter line is a deliberate migration (pyproject,
      # uv.lock, CI, docs). Python 3.15 is blocked upstream anyway:
      # onnxruntime, needed by the captcha extra (ddddocr), ships no cp315
      # wheels and no sdist.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # The Python lockfile (uv.lock) and the UI lockfile: majors arrive one per
  # PR (DuckDB 2, MCP 2, React 19, TypeScript 7 need their own migration),
  # minors and patches grouped so they land in one reviewable PR a month.
  # CI (pytest, vitest, both builds, the compose smoke) gates every one.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]

# Price refresh: pull the HuggingFace (US) dump AND a Stooq per-country stock
# dump — windowed OHLCV series + per-symbol distillate (ADR-0007) — recompute
# the snapshot with them, republish. The weekly HF pull already runs inside
# refresh-data; this workflow adds the Stooq (EU/JP/world) prices refresh-data
# does not fetch.
#
# Weekly schedule: one useful Stooq market per week, ROTATED by ISO week across
# the bulk dumps Stooq ACTUALLY PUBLISHES (probed 2026-07-16: d_us/uk/jp/pl/hu/
# hk_txt serve a zip; d_fr/de/it/mx_txt answer "Data missing" — France, Germany
# and Italy have NO bulk dump, their prices must come from the yfinance crawl).
# Hong Kong stays out of the rotation (its ~17k warrants/CBBCs are not in the
# universe: a manual HK run matched 1,287 of 17k, the rest genuinely absent,
# not a mapping defect).
# This is the ONLY Stooq path — the `crible stooq-download` command (below,
# with --import) does the captcha-clearing + import in one step.
#
# NOTE: use a per-country STOCK code (d_us/uk/jp/hk/pl/hu_txt) — d_world_txt is
# instruments only (no individual stocks) and imports nothing for the universe.
# Stooq is CAPTCHA-gated — `crible stooq-download` clears the proof-of-work +
# image captcha headlessly (SHA-256 hashcash + ddddocr OCR), so it runs here in
# CI. It stays best-effort (continue-on-error): prices are an enrichment, never
# a gate. A manual dispatch with an empty stooq_dataset uses the same weekly
# rotation as the schedule; set it to `skip` to leave Stooq out.

name: import-prices

on:
  schedule:
    # Monday 06:13 UTC — clear of the nightly refresh (23:47 + up to 4h)
    - cron: "13 6 * * 1"
  workflow_dispatch:
    inputs:
      stooq_dataset:
        description: "Stooq per-country STOCK code (d_us_txt, d_jp_txt, d_uk_txt, d_hk_txt…; empty = weekly rotation, skip = no Stooq)"
        default: ""
        required: false

permissions:
  contents: write
  issues: write # the failure beacon opens/bumps a labeled issue

# shared with every restore→publish cycle — see refresh-data.yml for the
# group rationale and the pending-run eviction trade-off
concurrency:
  group: data-release
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CRIBLE_DATA_DIR: data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --retry-all-errors so --retry also covers the HTTP 404 window a
      # concurrent `gh release upload --clobber` opens (see crawl-marathon.yml)
      - name: Restore last-good data from the data-latest release
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 \
            -o /tmp/crible-data.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/data-latest/crible-data.tar.gz"
          tar -xzf /tmp/crible-data.tar.gz

      # ddddocr (the captcha OCR) pulls opencv-python (not headless) → needs libGL.
      - name: Install the OpenGL runtime opencv needs
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv python install 3.12
      - run: uv sync --locked --extra captcha

      - name: Import the HuggingFace price dump (US — series + distillate)
        run: uv run crible import-prices huggingface

      - name: Import the defeatbeta dump (US prices + capital events)
        continue-on-error: true # prices are an enrichment, never a gate
        run: uv run crible import-prices defeatbeta

      # last-resort fundamentals: ONLY symbols with no audited raw and no
      # crawled yfinance statements (assumed-risk tier, provider=defeatbeta
      # provenance; audited data reconciles on top)
      - name: Import defeatbeta fundamentals for unserved symbols
        continue-on-error: true # an enrichment, never a gate
        run: uv run crible import-fundamentals defeatbeta

      # a scheduled run gets NO dispatch input and a manual one may leave it
      # empty — both rotate a useful market by ISO week; `skip` skips Stooq.
      # The input travels through env, never ${{ }}-interpolated into the
      # script (no shell injection), and must look like a Stooq code.
      - name: Pick the Stooq market
        id: stooq
        env:
          STOOQ_INPUT: ${{ inputs.stooq_dataset }}
        run: |
          input="${STOOQ_INPUT:-}"
          if [ "$input" = "skip" ]; then
            echo "stooq_dataset=skip — no Stooq this run"
            echo "dataset=" >> "$GITHUB_OUTPUT"
          elif [ -z "$input" ]; then
            # only bulk dumps Stooq actually serves (probed 2026-07-16) —
            # d_fr/de/it_txt do NOT exist and would waste their rotation slot;
            # HK stays out (see header) but remains a manual choice
            markets=(d_us_txt d_uk_txt d_jp_txt d_pl_txt d_hu_txt)
            week=$(date -u +%V)
            echo "dataset=${markets[$((10#$week % ${#markets[@]}))]}" >> "$GITHUB_OUTPUT"
          elif [[ "$input" =~ ^d_[a-z]+_txt$ ]]; then
            echo "dataset=$input" >> "$GITHUB_OUTPUT"
          else
            echo "::error::invalid stooq_dataset '$input' (expected d_<cc>_txt, empty or skip)"
            exit 1
          fi

      - name: Fetch the Stooq worldwide dump (proof-of-work + OCR captcha)
        id: stooq_fetch
        if: ${{ steps.stooq.outputs.dataset != '' }}
        continue-on-error: true # prices are an enrichment, never a gate
        env:
          STOOQ_DATASET: ${{ steps.stooq.outputs.dataset }}
        run: |
          uv run crible stooq-download "$STOOQ_DATASET" \
            --out "${RUNNER_TEMP}/stooq.zip" --import

      # continue-on-error swallows the step's failure — surface it in the run
      # summary so a dead dataset (Stooq's "Data missing") is never silent
      # again (d_fr_txt failed invisibly for weeks before 2026-07-16)
      - name: Surface a swallowed Stooq failure
        if: ${{ steps.stooq_fetch.outcome == 'failure' }}
        env:
          STOOQ_DATASET: ${{ steps.stooq.outputs.dataset }}
        run: |
          {
            echo "### ⚠️ Stooq fetch failed for \`$STOOQ_DATASET\`"
            echo "The step is best-effort so the run stays green — check the step log:"
            echo "Stooq answers \`Data missing\` for datasets it does not publish (fr/de/it/mx)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recompute the snapshot with the fresh quotes
        run: uv run crible compute

      - name: Export the static site artifacts (min-symbols gate)
        run: uv run crible export-site --out site-data --min-symbols 50

      - name: Publish the rolling data-latest release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-data-release.sh

      # Pages redeploys automatically: pages.yml triggers on this workflow's
      # completion (workflow_run), same as the nightly refresh-data. No manual
      # `gh workflow run` here — that needs `actions: write` and 403'd on the
      # default token (it only holds `contents: write`).

      # continue-on-error: a resolver blip must never redden a green publish
      # (and perversely fire the failure notify below); it self-heals on the
      # next green run
      - name: Resolve the failure beacon on a green run
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/resolve-workflow-beacon.sh "import-prices" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/notify-workflow-failure.sh "import-prices" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

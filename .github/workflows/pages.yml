# GitHub Pages — the hosted screener, the SPA built in static mode (DSL
# compiled in the browser, DuckDB-WASM over the published Parquet). Data comes
# from the site-data.tar.gz asset on the rolling data-latest release
# (maintained by refresh-data.yml); deploying without it just shows the
# "not published yet" state. Hash routing → no 404 fallback.

name: pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [refresh-data, import-prices]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress is SAFE here (unlike refresh-data): every pages build
# checks out HEAD and downloads the latest site-data.tar.gz, so the newest
# build is always the most complete — cancelling an older one loses nothing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # the artifact store intermittently rejects FinalizeArtifact with a
    # transient 403; deploy follows whichever upload attempt landed
    outputs:
      artifact_name: ${{ steps.upload.outcome == 'success' && 'github-pages' || 'github-pages-retry' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci --no-audit --no-fund

      - name: Build the SPA in static mode
        run: npm --prefix ui run build
        env:
          VITE_DATA_MODE: static
          VITE_BASE: /crible/

      - name: Attach the published data artifacts
        run: |
          mkdir -p ui/dist/data
          # --retry-all-errors so --retry also covers the HTTP 404 window a
          # concurrent `gh release upload --clobber` opens: without it a
          # transient 404 takes the else-branch and DEPLOYS A DATA-LESS SITE
          # over a perfectly good one.
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 15 \
              -o /tmp/site-data.tar.gz \
              "https://github.com/${{ github.repository }}/releases/download/data-latest/site-data.tar.gz"; then
            tar -xzf /tmp/site-data.tar.gz -C /tmp
            cp -R /tmp/site-data/. ui/dist/data/
            echo "attached $(find /tmp/site-data -mindepth 1 -maxdepth 1 | wc -l) data artifacts"
            # generation stamp in the run summary: which dataset this deploy ships
            {
              echo "### Dataset generation"
              echo '```json'
              python3 -c "import json; m=json.load(open('/tmp/site-data/manifest.json')); print(json.dumps({k: m.get(k) for k in ('schema','generated_at','snapshot_symbols','commit')}, indent=2))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no published dataset yet — the site will show 'not published yet'"
          fi
          touch ui/dist/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - id: upload
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        continue-on-error: true
        with:
          path: ui/dist
      # second attempt under a FRESH name: a failed finalize can leave the
      # default "github-pages" artifact half-created and unclaimable
      - if: steps.upload.outcome == 'failure'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ui/dist
          name: github-pages-retry

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

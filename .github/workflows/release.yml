# Automated releases: every green push to main is analyzed by
# python-semantic-release — conventional commits decide the bump (feat →
# minor, fix/perf → patch; docs/ci/chore/refactor → no release). When a
# release is cut, the SAME workflow builds the multi-arch Docker image
# (amd64 for the classic VPS path, arm64 for Hetzner CAX / Apple Silicon /
# Pi NAS) — it must live here because a tag pushed with GITHUB_TOKEN never
# triggers other workflows (GitHub recursion protection). The same goes for
# the CLI (job cli): the release's wheel and sdist, attached to it.
# Every green push to main also publishes `main` + `sha-<short>` + `latest`
# (job docker-main), so the image is always current. When that push cuts a
# release, the docker job owns `latest` (the bumped commit) instead.
# Only GITHUB_TOKEN is used: the zero-key contract extends to CI.
# Out of scope: the rolling `data-latest` release (data channel, ADR-0006) —
# it is not a semver tag, semantic-release never touches it.

name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the next version without releasing (no-op mode)"
        type: boolean
        default: false
      cli_tag:
        description: "Attach the CLI (wheel + sdist) to this existing release tag, e.g. v0.17.0 — skips the version job"
        type: string
        default: ""

permissions:
  contents: write
  packages: write

# queue releases, never cancel one mid-flight
concurrency:
  group: release

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.cli_tag == '') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.psr.outputs.released }}
      version: ${{ steps.psr.outputs.version }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # semantic-release walks the history since the last v* tag
          fetch-depth: 0
      - name: Semantic release — bump, tag, GitHub Release
        id: psr
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: "false"
          no_operation_mode: ${{ inputs.dry_run == true }}

  # The CLI of every release: its wheel and sdist, attached to the GitHub
  # Release once the wheel's `crible --version` prints the tag. The Homebrew
  # formula (maxgfr/homebrew-tap) follows the tag's source tarball, which holds
  # uv.lock; the wheel is for `uv tool install <url>` of one exact release.
  cli:
    needs: version
    if: >-
      !cancelled() &&
      (needs.version.outputs.released == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.cli_tag != ''))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag || inputs.cli_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv python install 3.12
      - run: uv build
      - name: Smoke-test the wheel
        run: |
          version="${TAG#v}"
          out="$(uvx --python 3.12 --from "dist/crible-${version}-py3-none-any.whl" crible --version)"
          echo "crible --version → $out"
          test "$out" = "$version"
      - name: Attach the CLI to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber

  docker:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build the bumped commit, not the pre-release SHA
          ref: ${{ needs.version.outputs.tag }}
      # semantic-release adds its own version commit after github.sha: the
      # image must say it was built from the TAGGED commit it actually holds
      - id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted fundamental stock screener
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.licenses=MIT

  docker-main:
    needs: version
    if: >-
      !cancelled() &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
            ${{ needs.version.outputs.released != 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Self-hosted fundamental stock screener
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.licenses=MIT
